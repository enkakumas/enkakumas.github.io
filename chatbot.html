<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN-KAI | Güvenli Yönlendirme</title>
    <style>
        /* Tamamen saf beyaz ve merkezlenmiş tasarım */
        body {
            background-color: #ffffff;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Yükleme Animasyonu Konteyneri */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Şık Spinner (Dönen Halka) Animasyonu */
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #f3f3f3; /* Açık gri arka plan */
            border-top: 4px solid #333333; /* Koyu gri dönen kısım */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.3rem;
            color: #111;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        /* Kırmızı Uyarı Kutucuğu */
        .warning-box {
            margin-top: 50px;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            border-left: 5px solid #ef4444; /* Sol tarafı kalın kırmızı */
            padding: 16px 24px;
            max-width: 500px;
            text-align: center;
            color: #991b1b;
            font-size: 0.95rem;
            line-height: 1.6;
            border-radius: 6px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .warning-box a {
            color: #b91c1c;
            font-weight: bold;
            text-decoration: underline;
        }

        /* Bot Tuzağı (Honeypot) - İnsanlar Göremez, Botlar Form Sanıp Doldurur */
        .honeypot-wrapper {
            opacity: 0;
            position: absolute;
            top: -9999px;
            left: -9999px;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="honeypot-wrapper">
        <label for="bot-check">Lütfen bu alanı boş bırakın (Eğer insansanız):</label>
        <input type="text" id="bot-check" name="bot-check" value="" autocomplete="off" tabindex="-1">
    </div>

    <div class="loader-container">
        <div class="spinner"></div>
        <div class="loading-text">Siteye Yönlendiriliyorsunuz...</div>
    </div>

    <div class="warning-box">
        Bu yapay zeka destekli sistemi kullanarak sistemin Kullanım şartları ve gizlilik politikasını kabul etmiş sayılırsınız. Politikalara <a href="https://enkai.onrender.com">enkai.onrender.com</a> sitesi üstünden erişebilirsiniz.
    </div>

    <script>
        // Sayfa açıldıktan sonra tam 5 saniye (5000 ms) sayar
        setTimeout(function() {
            // Gizli inputun içindeki değeri alıyoruz
            var honeypotValue = document.getElementById('bot-check').value;
            
            // Eğer o gizli kutucuk doldurulmuşsa (yani işlemi bir bot yapıyorsa)
            if (honeypotValue !== "") {
                console.warn("Şüpheli aktivite (Bot) tespit edildi. Yönlendirme iptal edildi.");
                // Botu sahte bir boş sayfaya hapsediyoruz
                document.body.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; color: #dc2626; font-family: sans-serif; font-weight: bold; font-size: 1.5rem;">
                        403 - Erişim Reddedildi (Bot Algılandı)
                    </div>
                `;
                return; // Kodun aşağıya inip gerçek siteye yönlendirmesini durdurur
            }
            
            // Kutucuk boşsa (yani temiz, gerçek bir insansa) EN-KAI'ye gönder
            window.location.href = "https://enkai.onrender.com";
            
        }, 5000);
    </script>

</body>
</html>
